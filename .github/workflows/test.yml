name: Tests

on:
  push:
    branches: [ main, cursor/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    
    - name: Run ruff linting
      run: |
        ruff check src/ tests/ app/
        echo "✓ Linting passed"
  
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Install app dependencies
      run: |
        pip install -r app/requirements.txt pytest httpx

    - name: Run app tests
      run: |
        pytest app/tests -v --tb=short

    - name: Test task generation (dry run)
      run: |
        python -m src.generate_tasks --seed 3001 --output-dir tasks3001
        python -m src.generate_tasks --seed 3002 --output-dir tasks3002
        test -f tasks3001/tasks.json || exit 1
        echo "✓ Task generation successful"

    - name: Test runner (dry run)
      run: |
        python -m src.runner --dry-run --limit 3 --tasks-dir tasks3001
        test -f output/results.json || exit 1
        echo "✓ Runner dry-run successful"

    - name: Test scorer
      run: |
        python -m src.scorer output/results.json tasks3001/answers
        echo "✓ Scorer successful"

    - name: Test fine-tune prep
      run: |
        python -m src.finetune_prep --tasks-dir tasks3001@3001 --tasks-dir tasks3002@3002 --val-seeds 3002
        test -f finetune_data/train.jsonl || exit 1
        test -f finetune_data/validation.jsonl || exit 1
        echo "✓ Fine-tune prep successful"
    
    - name: Test fine-tune cost estimate
      run: |
        python -m src.finetune --dry-run
        echo "✓ Fine-tune estimate successful"
