name: Tests

on:
  push:
    branches: [ main, cursor/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    
    - name: Run ruff linting
      run: |
        ruff check src/ tests/ app/
        echo "✓ Linting passed"
  
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Guard protected benchmark files
      run: |
        # Existing tier generators and any generated task/answer files
        # must never change. src/scorer.py and src/generate_tasks.py are
        # intentionally extended by the tools-frontier tier (per-family
        # scorer schemas and a --tier tools_frontier entry point, as
        # required by SCOPE.md and justified in docs/BENCHMARK.md), so
        # they are no longer blanket-guarded; their existing-tier
        # behaviour is covered by the unchanged scorer/tier test suites.
        git fetch origin '+refs/heads/main:refs/remotes/origin/main'
        CHANGED="$(git diff --name-only origin/main...HEAD -- \
          src/frontier_tier.py src/hard_tier.py \
          'tasks*/')"
        if [ -n "$CHANGED" ]; then
          echo "Protected files changed:"
          echo "$CHANGED"
          exit 1
        fi
        echo "✓ Protected files unchanged"

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Enable bubblewrap sandbox tests
      run: |
        sudo apt-get update
        sudo apt-get install -y bubblewrap
        # Ubuntu 24.04 AppArmor otherwise blocks unprivileged userns.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Install app dependencies
      run: |
        pip install -r app/requirements.txt pytest httpx

    - name: Run app tests
      run: |
        pytest app/tests -v --tb=short

    - name: Test task generation (dry run)
      run: |
        python -m src.generate_tasks --seed 3001 --output-dir tasks3001
        python -m src.generate_tasks --seed 3002 --output-dir tasks3002
        test -f tasks3001/tasks.json || exit 1
        echo "✓ Task generation successful"

    - name: Test runner (dry run)
      run: |
        python -m src.runner --dry-run --limit 3 --tasks-dir tasks3001
        test -f output/results.json || exit 1
        echo "✓ Runner dry-run successful"

    - name: Test tool-mode runner (dry run, no API calls)
      run: |
        python -m src.runner --dry-run --tools python --limit 3 --tasks-dir tasks3001 --output-dir output_tool
        test -f output_tool/results.json || exit 1
        test -f output_tool/transcripts/task_001.jsonl || exit 1
        echo "✓ Tool-mode runner dry-run successful"

    - name: Test tools-frontier tier (offline, no API calls)
      run: |
        python -m src.generate_tasks --tier tools_frontier --seed 7001 --count 30 --output-dir tasks_tools_frontier_ci
        test -f tasks_tools_frontier_ci/task_tf_3001/spec.md || exit 1
        python -m src.runner --dry-run --tools python --limit 2 --tasks-dir tasks_tools_frontier_ci --output-dir output_tf_tool
        test -f output_tf_tool/transcripts/task_tf_3001.jsonl || exit 1
        echo "✓ Tools-frontier generation and tool-mode dry-run successful"

    - name: Test scorer
      run: |
        python -m src.scorer output/results.json tasks3001/answers
        echo "✓ Scorer successful"

    - name: Test fine-tune prep
      run: |
        python -m src.finetune_prep --tasks-dir tasks3001@3001 --tasks-dir tasks3002@3002 --val-seeds 3002
        test -f finetune_data/train.jsonl || exit 1
        test -f finetune_data/validation.jsonl || exit 1
        echo "✓ Fine-tune prep successful"
    
    - name: Test fine-tune cost estimate
      run: |
        python -m src.finetune --dry-run
        echo "✓ Fine-tune estimate successful"
